name: Feature request or new site
description: Suggest an improvement, a new site, or catalogue products to add.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options:
        - A new site to compare
        - Catalogue products or synonyms to add
        - A change to the web page or phone view
        - A new command, API or schedule option
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first. A solution comes second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: For a new site, give its web address and whether it works without signing in. For catalogue products, list the names people use (English, Hindi, Tamil and so on).
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can try a fix or send a pull request
