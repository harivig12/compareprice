<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Basket — grocery price comparison</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#272e38;
    --text:#e6edf3; --dim:#8b949e; --faint:#6e7681;
    --win:#3fb950; --warn:#d29922; --bad:#f85149; --link:#58a6ff;
    --radius:10px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text); padding:28px 20px 80px;
    font:15px/1.55 -apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin:0 auto; }

  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { font-size:25px; margin:0; letter-spacing:-.02em; }
  .meta { color:var(--dim); font-size:12.5px; }
  .meta b { color:var(--text); font-weight:600; }

  /* ── composer ─────────────────────────────────────────── */
  .composer {
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin:20px 0 22px;
  }
  .composer label { display:block; font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--dim); font-weight:600; margin-bottom:8px; }
  textarea {
    width:100%; min-height:110px; resize:vertical; background:var(--bg);
    color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:11px 13px; font:13.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  textarea:focus { outline:none; border-color:#3d4d5e; }
  .row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:12px; }
  .plats { display:flex; gap:14px; flex-wrap:wrap; }
  .plats label { display:flex; align-items:center; gap:6px; text-transform:none;
    letter-spacing:0; font-size:13px; color:var(--text); font-weight:400; margin:0; cursor:pointer; }
  .plats input { accent-color:var(--win); cursor:pointer; }
  button {
    background:var(--win); color:#06210d; border:none; border-radius:7px;
    padding:9px 20px; font-size:14px; font-weight:650; cursor:pointer;
  }
  button:hover:not(:disabled) { filter:brightness(1.08); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .status { font-size:13px; color:var(--dim); }
  .status.err { color:var(--bad); }
  .spin { display:inline-block; width:11px; height:11px; margin-right:7px;
    border:2px solid var(--faint); border-top-color:var(--win);
    border-radius:50%; animation:sp .7s linear infinite; vertical-align:-1px; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ── verdict ──────────────────────────────────────────── */
  .verdict {
    background:var(--panel); border:1px solid var(--line);
    border-left:4px solid var(--win); border-radius:var(--radius);
    padding:18px 22px; margin-bottom:10px;
  }
  .verdict .who { font-size:21px; font-weight:650; }
  .verdict .who b { color:var(--win); }
  .verdict .save { font-size:33px; font-weight:750; color:var(--win); margin-top:5px; letter-spacing:-.02em; }
  .verdict .vs { color:var(--dim); font-size:13.5px; margin-top:3px; }

  .caveat, .coverage { border-radius:8px; padding:11px 15px; margin-bottom:10px; font-size:13px; }
  .caveat  { background:#2a2011; border:1px solid #57430f; color:#e3b341; }
  .coverage{ background:#0d2231; border:1px solid #1f4b6b; color:#79c0ff; }
  .coverage .sub, .caveat .sub { color:var(--dim); margin-top:4px; font-size:12.5px; }

  /* ── table ────────────────────────────────────────────── */
  .tablewrap { overflow-x:auto; margin:20px 0 24px; border-radius:var(--radius);
    border:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; min-width:560px; }
  th,td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  thead th { background:var(--panel); font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--dim); font-weight:600; white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tbody tr:last-child td { border-bottom:none; }
  tr.fees td { color:var(--dim); font-size:12.5px; }
  tr.totals td { border-top:2px solid var(--line); font-weight:700; font-size:16.5px; padding-top:13px; }
  .winner-col { color:var(--win); }
  .item { font-weight:500; }
  .detail { color:var(--dim); font-size:12px; margin-top:3px; font-weight:400; }
  .missing { color:var(--bad); font-size:12.5px; }

  .badge { display:inline-block; padding:1px 7px; border-radius:20px;
    font-size:10.5px; font-weight:600; margin-left:6px; vertical-align:1px; }
  .b-ok  { background:rgba(63,185,80,.15);  color:var(--win); }
  .b-warn{ background:rgba(210,153,34,.15); color:var(--warn); }
  .b-bad { background:rgba(248,81,73,.15);  color:var(--bad); }

  /* ── panels ───────────────────────────────────────────── */
  .panel { background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px 20px; margin-bottom:16px; }
  .panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--dim); margin:0 0 11px; font-weight:600; }
  .panel ul { margin:0; padding-left:18px; }
  .panel li { margin-bottom:7px; font-size:13.5px; }
  code { background:var(--panel2); padding:1px 6px; border-radius:4px;
    font:12px ui-monospace,SFMono-Regular,Consolas,monospace; }
  a { color:var(--link); text-decoration:none; word-break:break-all; }
  a:hover { text-decoration:underline; }
  .foot { color:var(--faint); font-size:12px; margin-top:26px;
    border-top:1px solid var(--line); padding-top:14px; }
  .empty { color:var(--dim); text-align:center; padding:56px 20px; }
  .empty h3 { color:var(--text); margin:0 0 10px; font-size:17px; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Basket</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="composer">
    <label for="items">Your basket — one item per line, optional leading quantity</label>
    <textarea id="items" spellcheck="false" placeholder="2x amul taaza toned milk 500ml
amul butter 500g
tata salt 1kg"></textarea>
    <div class="row">
      <div class="plats" id="plats"></div>
      <button id="go">Compare</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div id="out"><div class="empty"><h3>No comparison yet</h3>
    Paste a basket above and press Compare — or run
    <code>basket list.txt --web</code> in your terminal.</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const out = $('out'), statusEl = $('status'), goBtn = $('go'), itemsEl = $('items');

let running = false;
let dirty = false;          // user has edited the textarea; don't clobber it
let lastStamp = null;

itemsEl.addEventListener('input', () => { dirty = true; });

const rupees = (n) => n == null ? '—' :
  '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// ── controls ──────────────────────────────────────────────
async function loadMeta() {
  try {
    const meta = await (await fetch('/api/meta')).json();
    $('plats').innerHTML = meta.platforms.map((p) => {
      const on = meta.defaultPlatforms.includes(p) ? ' checked' : '';
      return `<label><input type="checkbox" value="${esc(p)}"${on}>${esc(cap(p))}</label>`;
    }).join('');
  } catch {
    $('plats').innerHTML = '<span class="status err">Server unreachable</span>';
  }
}

function chosenPlatforms() {
  return [...document.querySelectorAll('#plats input:checked')].map((i) => i.value);
}

async function runCompare() {
  if (running) return;
  const items = itemsEl.value.trim();
  if (!items) { setStatus('Add at least one item.', true); return; }
  const platforms = chosenPlatforms();
  if (platforms.length === 0) { setStatus('Pick at least one platform.', true); return; }

  running = true;
  goBtn.disabled = true;
  setStatus('<span class="spin"></span>Comparing… this drives a real browser, so it takes a while.');

  try {
    const res = await fetch('/api/compare', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ items, platforms }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    dirty = false;
    render(body);
    setStatus('Done.');
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    running = false;
    goBtn.disabled = false;
  }
}

function setStatus(html, isErr) {
  statusEl.className = 'status' + (isErr ? ' err' : '');
  statusEl.innerHTML = html;
}

goBtn.addEventListener('click', runCompare);
itemsEl.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runCompare();
});

// ── polling ───────────────────────────────────────────────
async function poll() {
  if (running) return;
  try {
    const res = await fetch('/api/result');
    if (res.status === 204) return;
    const r = await res.json();
    if (r.generatedAt !== lastStamp) render(r);
  } catch { /* server went away; keep the last view on screen */ }
}

// ── render ────────────────────────────────────────────────
function render(r) {
  lastStamp = r.generatedAt;

  $('meta').innerHTML =
    `pincode <b>${esc(r.pincode)}</b> · ${(r.elapsedMs/1000).toFixed(1)}s · ` +
    `${r.platforms.length} platforms · via <b>${esc(r.backend)}</b>`;

  if (!dirty) itemsEl.value = r.basket.map((i) => i.qty > 1 ? `${i.qty}x ${i.query}` : i.query).join('\n');

  const plats = r.platforms;
  const winner = r.winner && r.winner.platform;
  const onSubset = !r.likeForLike && r.winner && r.winner.subsetTotal != null;
  let h = '';

  // verdict
  if (r.winner) {
    const mine = onSubset ? r.winner.subsetTotal : r.winner.total;
    h += `<div class="verdict"><div class="who"><b>${esc(r.winner.label)}</b> is cheapest`
       + (onSubset ? ' on what everyone stocks' : '') + ` — ${rupees(mine)}</div>`;
    if (r.runnerUp && r.saving > 0) {
      const rival = onSubset ? r.runnerUp.subsetTotal : r.runnerUp.total;
      h += `<div class="save">You save ${rupees(r.saving)}</div>`
         + `<div class="vs">vs ${esc(r.runnerUp.label)} at ${rupees(rival)}</div>`;
    }
    h += `</div>`;
  } else {
    h += `<div class="verdict" style="border-left-color:var(--bad)">`
       + `<div class="who">No platform returned a usable basket.</div></div>`;
  }

  if (!r.likeForLike) {
    const ws = plats.find((p) => p.platform === winner);
    h += `<div class="caveat"><b>${esc(r.winner ? r.winner.label : '')} only stocked `
       + `${ws ? ws.fulfilledLines : '?'}/${ws ? ws.totalLines : '?'} of your basket.</b>`
       + (r.comparedOn ? `<div class="sub">The verdict compares ${esc(r.comparedOn)} — column totals below cover different goods.</div>` : '')
       + `</div>`;
    if (r.coverageWarning) {
      const cw = r.coverageWarning;
      h += `<div class="coverage">→ <b>Best coverage: ${esc(cw.label)} — ${cw.fulfilledLines}/${cw.totalLines} at ${rupees(cw.total)}</b>, one trip instead of two.`
         + `<div class="sub">Cheapest is only cheapest if you don't mind sourcing ${cw.winnerMissing} item${cw.winnerMissing === 1 ? '' : 's'} elsewhere.</div></div>`;
    }
  }

  // table
  h += `<div class="tablewrap"><table><thead><tr><th>Item</th>`;
  for (const p of plats) {
    h += `<th class="num${p.platform === winner ? ' winner-col' : ''}">${esc(cap(p.platform))}</th>`;
  }
  h += `</tr></thead><tbody>`;

  for (const item of r.basket) {
    const name = item.qty > 1 ? `${item.qty}× ${item.query}` : item.query;
    h += `<tr><td class="item">${esc(name)}</td>`;
    for (const p of plats) {
      const line = p.lines.find((l) => l.query === item.query);
      if (!line || line.lineTotal == null) {
        h += `<td class="num"><span class="missing">`
           + (line && line.status === 'out-of-stock' ? 'out of stock' : 'not found')
           + `</span></td>`;
        continue;
      }
      const pr = line.product;
      const badge = line.status === 'low-confidence'
        ? `<span class="badge b-warn">${pr.confidence}</span>`
        : `<span class="badge b-ok">${pr.confidence}</span>`;
      const packs = pr.packs > 1 ? `${pr.packs}× ` : '';
      const bits = [pr.packLabel ? packs + pr.packLabel : null, pr.pricePerUnitLabel]
        .filter(Boolean).join(' · ');
      h += `<td class="num">${rupees(line.lineTotal)}${badge}`
         + `<div class="detail">${esc(String(pr.name).slice(0,44))}</div>`
         + (bits ? `<div class="detail">${esc(bits)}</div>` : '')
         + `</td>`;
    }
    h += `</tr>`;
  }

  h += `<tr class="fees"><td>Delivery</td>`;
  for (const p of plats) h += `<td class="num">${!p.fees.known ? '—' : p.fees.freeDeliveryApplied ? 'FREE' : rupees(p.fees.deliveryFee)}</td>`;
  h += `</tr><tr class="fees"><td>Handling</td>`;
  for (const p of plats) h += `<td class="num">${p.fees.known ? rupees(p.fees.handlingFee) : '—'}</td>`;
  h += `</tr>`;

  h += `<tr class="totals"><td>${r.feesKnown ? 'Basket total' : 'Goods total'}</td>`;
  for (const p of plats) {
    h += `<td class="num${p.platform === winner ? ' winner-col' : ''}">${rupees(p.total)}`
       + `<div class="detail">${p.fulfilledLines}/${p.totalLines} items</div></td>`;
  }
  h += `</tr></tbody></table></div>`;

  // flags
  const low = plats.flatMap((p) => p.lowConfidence.map((l) => ({ p:p.platform, ...l })));
  if (low.length) {
    h += `<div class="panel"><h2>Flagged below threshold — shown, not silently totalled</h2><ul>`;
    for (const l of low) {
      h += `<li><code>${esc(l.p)}</code> “${esc(l.query)}” → ${esc(l.name)}`
         + ` <span class="badge b-warn">${l.confidence}</span>`
         + `<div class="detail">${esc(l.reason)}</div></li>`;
    }
    h += `</ul></div>`;
  }

  const miss = plats.flatMap((p) => p.missing.map((m) => ({ p:p.platform, ...m })));
  if (miss.length) {
    h += `<div class="panel"><h2>Excluded from totals</h2><ul>`;
    for (const m of miss) {
      h += `<li><code>${esc(m.p)}</code> “${esc(m.query)}” <span class="badge b-bad">${esc(m.status)}</span></li>`;
    }
    h += `</ul></div>`;
  }

  if (r.unavailable && r.unavailable.length) {
    h += `<div class="panel"><h2>Platforms unavailable</h2><ul>`;
    for (const u of r.unavailable) {
      h += `<li><code>${esc(u.platform)}</code> ${esc(u.error)}</li>`;
    }
    h += `</ul></div>`;
  }

  // links
  h += `<div class="panel"><h2>Buy it here</h2><ul>`;
  for (const p of plats) {
    const url = (p.lines.find((l) => l.product && l.product.url) || {}).product;
    h += `<li>${p.platform === winner ? '→ ' : ''}<b>${esc(cap(p.platform))}</b> ${rupees(p.total)}`
       + (url ? `<div class="detail"><a href="${esc(url.url)}" target="_blank" rel="noopener">${esc(url.url)}</a></div>` : '')
       + `</li>`;
  }
  h += `</ul></div>`;

  if (!r.feesKnown) {
    h += `<div class="caveat"><b>Goods only — delivery and handling are NOT included.</b>`
       + `<div class="sub">Platforms only reveal fees at checkout, so they can't be read here.`
       + (r.feesMissing && r.feesMissing.length ? ` No fees set for ${esc(r.feesMissing.join(', '))}.` : '')
       + ` Set them once with <code>basket fees --set blinkit --delivery 25 --handling 9</code>.</div></div>`;
  }

  h += `<div class="foot">Confidence threshold ${r.confidenceThreshold} · `
     + `generated ${esc(r.generatedAt)}</div>`;

  out.innerHTML = h;
}

loadMeta();
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
